name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches pubspec version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with pubspec.yaml
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pubspec=$PUBSPEC_VERSION tag=$TAG_VERSION"
          if [ "${TAG_VERSION%%+*}" != "${PUBSPEC_VERSION%%+*}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi

  build-linux:
    name: Build Linux x64
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: tar -czf android_app_manager_linux_x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: android_app_manager_linux_x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath android_app_manager_windows_x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: android_app_manager_windows_x64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS universal
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: macos-latest
    env:
      APP_PATH: build/macos/Build/Products/Release/Android App Manager.app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Verify universal binary and ad-hoc signature
        run: |
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/Android App Manager")"
          echo "Architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::Expected a universal binary, got: $ARCHS"; exit 1 ;;
          esac
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          defaults read "$PWD/$APP_PATH/Contents/Info.plist" CFBundleIdentifier
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" android_app_manager_macos_universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: android_app_manager_macos_universal.zip
          if-no-files-found: error

  release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/android_app_manager_windows_x64.zip
            dist/android_app_manager_linux_x64.tar.gz
            dist/android_app_manager_macos_universal.zip
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
